# Analysis, tests and the Android APK on every push. On a version tag (v1.0.0…)
# the APK is attached to a GitHub release, so the download is built from the
# tagged source. No secrets are needed: the APK is signed with a debug key.
name: Android

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: write # creating the release on a tag

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.6'
          channel: stable
          cache: true

      # the database tests open an in-memory SQLite through the system library
      - name: SQLite for tests
        run: sudo apt-get update -q && sudo apt-get install -y -q libsqlite3-dev

      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

      - name: Build APK
        run: |
          flutter build apk --release
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-release.apk "dist/eventix-scanner-${GITHUB_REF_NAME//\//-}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: eventix-scanner-apk
          path: dist/*.apk

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.apk
          generate_release_notes: true
          body: |
            Android APK built by CI from this tag (debug-signed, for test phones; Android 7.0+).
            Install: download the APK on the phone, allow installing from this source, tap Install.
            iOS is not built in this release; see the README's Known limitations.
